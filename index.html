<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anteractive.io — Interactive Mobile Games & Apps</title>
  <style>
    :root {
      --bg-deep: #0d1117;
      --bg-surface: #161b22;
      --bg-glass: rgba(22, 27, 34, 0.72);
      --border: #30363d;
      --border-glow: rgba(88, 166, 255, 0.45);
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --accent-blue: #58a6ff;
      --accent-purple: #a371f7;
      --accent-green: #238636;
      --accent-green-hover: #2ea043;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }

    .space-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(163, 113, 247, 0.22), transparent 60%),
        radial-gradient(ellipse 65% 45% at 85% 15%, rgba(88, 166, 255, 0.18), transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 100%, rgba(35, 134, 54, 0.12), transparent 60%),
        var(--bg-deep);
    }

    #starfield {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: rgba(13, 17, 23, 0.78);
      border-bottom: 1px solid var(--border);
    }
